name: Build Movocco APK

on:
  workflow_dispatch:
  push:
    branches:
      - astro/movocco-app

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    # A healthy first build takes ~30 min; fail loudly instead of hanging.
    timeout-minutes: 45
    env:
      # Supabase connection for the app (the anon key is public by design;
      # RLS on the database enforces access). Stored as repo Actions
      # secrets, never committed to the repo.
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/android/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        # Caches Gradle dependencies and build outputs between runs.
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3 defaults packages to "tools platform-tools", but Google removed
          # the legacy "tools" package from the SDK repository (Sep 2026), so
          # the bare call fails with "Failed to find package 'tools'".
          # platform-tools is all this step needs; the next step installs the
          # platform, build-tools, NDK and CMake.
          packages: platform-tools

      - name: Cache Android SDK packages
        # The NDK alone is ~1 GB to download every run. Cache the installed
        # packages; sdkmanager below is idempotent and repairs anything the
        # cache misses. Keyed on this file so a package-list change busts it.
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk
            /usr/local/lib/android/sdk/build-tools
            /usr/local/lib/android/sdk/cmake
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/licenses
          key: android-sdk-v1-${{ hashFiles('.github/workflows/build-apk.yml') }}
          restore-keys: |
            android-sdk-v1-

      - name: Install Android SDK packages
        # platforms;android-37 is not listed in Google's stable SDK repository
        # (sdkmanager cannot find it), but the platform archive is served
        # directly at dl.google.com. Download it only if the platform is not
        # already installed (e.g. restored from cache), unpack to
        # platforms/android-37.0, and copy to platforms/android-37, which is
        # where Gradle looks for compileSdk 37. Expo SDK 58 modules require
        # compileSdk 37, so compiling against 36 is not an option.
        # unzip -o: the runner image already ships an android-37.0 dir, and a
        # bare unzip would stop to ask whether to overwrite it.
        run: |
          sdkmanager "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
          yes | sdkmanager --licenses
          if [ ! -f "$ANDROID_HOME/platforms/android-37/android.jar" ]; then
            curl -sS -o /tmp/platform-37.0_r02.zip https://dl.google.com/android/repository/platform-37.0_r02.zip
            unzip -o -q /tmp/platform-37.0_r02.zip -d "$ANDROID_HOME/platforms"
            cp -r "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          ls "$ANDROID_HOME/platforms/android-37/android.jar"

      - name: Install dependencies
        working-directory: apps/android
        run: npm ci

      - name: Restore brand assets
        working-directory: apps/android
        run: node scripts/restore-brand-assets.js

      - name: Check Supabase config
        # Fail loudly if the secrets are missing instead of silently
        # shipping a DEMO-only build. Values are never printed.
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "Supabase env vars missing — set the EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY repo secrets"
            exit 1
          fi

      - name: Prebuild Android
        working-directory: apps/android
        run: npx expo prebuild --platform android --non-interactive

      - name: Build release APK
        working-directory: apps/android/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: movocco-apk
          path: apps/android/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
