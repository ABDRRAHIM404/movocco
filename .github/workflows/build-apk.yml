name: Build Movocco APK

on:
  workflow_dispatch:
  push:
    branches:
      - astro/movocco-app

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/android/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
          yes | sdkmanager --licenses

      - name: Install dependencies
        working-directory: apps/android
        run: npm ci

      - name: Restore brand assets
        working-directory: apps/android
        run: node scripts/restore-brand-assets.js

      - name: Prebuild Android
        working-directory: apps/android
        run: npx expo prebuild --platform android --non-interactive

      - name: Build release APK
        working-directory: apps/android/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: movocco-apk
          path: apps/android/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
