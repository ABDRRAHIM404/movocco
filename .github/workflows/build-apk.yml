name: Build Movocco APK

on:
  workflow_dispatch:
  push:
    branches:
      - astro/movocco-app

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/android/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3 defaults packages to "tools platform-tools", but Google removed
          # the legacy "tools" package from the SDK repository (Sep 2026), so
          # the bare call fails with "Failed to find package 'tools'".
          # platform-tools is all this step needs; the next step installs the
          # platform, build-tools, NDK and CMake.
          packages: platform-tools

      - name: Install Android SDK packages
        # platforms;android-37 is not served by Google's stable SDK repository
        # (build-tools 37.0.0 is, but the platform itself is not), so the app
        # compiles against API 36 (targetSdk is already 36).
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
          yes | sdkmanager --licenses

      - name: Install dependencies
        working-directory: apps/android
        run: npm ci

      - name: Restore brand assets
        working-directory: apps/android
        run: node scripts/restore-brand-assets.js

      - name: Prebuild Android
        working-directory: apps/android
        run: npx expo prebuild --platform android --non-interactive

      - name: Build release APK
        working-directory: apps/android/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: movocco-apk
          path: apps/android/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
